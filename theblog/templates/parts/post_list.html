
    {% for post in posts %}

    <div class="card mb-4">
      <div class="card-body">
          <h2 class="card-title">{{ post.title }}</h2>

          <p class="card-text text-muted h6">By: {{ post.author }} | {{ post.date_added }}

          </p>
          <p class="card-text">{{ post.snippet }}</p>
          <a href="{% url 'post_detail' post.category.slug post.slug %}" class="btn btn-info"><i class="fas fa-book-open pr-1"></i>Читать..</a>
      </div>
</div>
      <hr>


      {% endfor %}
